[project]
name = "telegram-digest-bot"
version = "0.1.0"
description = "Telegram bot for weekly group chat digests powered by Claude AI"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4.0",
    "aiosqlite>=0.20,<1.0",
    "anthropic>=0.42,<1.0",
    "apscheduler>=3.10,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
